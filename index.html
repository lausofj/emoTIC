/* ---------- Grados ---------- */
const GRADE_SEQUENCE = ["Jardín","Primero","Segundo","Tercero","Cuarto","Quinto","Sexto","Séptimo","Octavo","Noveno","Décimo","Undécimo"];

function normalize(s){
  return s.trim()
    .replace(/^s/,'S').replace(/^p/,'P').replace(/^t/,'T').replace(/^c/,'C')
    .replace(/^q/,'Q').replace(/^o/,'O').replace(/^n/,'N').replace(/^d/,'D')
    .replace(/^u/,'U').replace(/^j/,'J');
}

function expandGrado(str){
  if(str.includes(" a ")){
    const [from,to] = str.split(" a ").map(s=>normalize(s));
    const i = GRADE_SEQUENCE.indexOf(from);
    const j = GRADE_SEQUENCE.indexOf(to);
    if(i===-1 || j===-1) return [str];
    return GRADE_SEQUENCE.slice(i, j+1);
  }
  return [normalize(str)];
}
DATA.forEach(d=> d.grados = expandGrado(d.grado));

/* ---------- Categorías ---------- */
const CATEGORY_ORDER = [
  "Guía de trabajo (estudiantes)",
  "Guía de trabajo (profesores)",
  "Actividad",
  "Taller",
  "Tarjetas",
  "Videos",
  "Sitio web offline",
  "Malla de aprendizajes"
];
const CATEGORY_COLORS = {
  "Guía de trabajo (estudiantes)": "#F2B807",
  "Guía de trabajo (profesores)": "#08b1b1",
  "Actividad": "#d4690c",
  "Taller": "#6B5B95",
  "Tarjetas": "#cf639e",

  "Sitio web offline": "#4477A1",

};

let links = {};
DATA.forEach(d=>{ if(d.link) links[d.id] = d.link; });

let activeGrade = "Todos";
let activeCategory = "Todas";
let query = "";
let editMode = false;

function isValidUrl(v){ return !!v && /^https?:\/\/.+/i.test(v.trim()); }

function countForGrade(g){
  return DATA.filter(d => g==="Todos" || d.grados.includes(g)).length;
}

/* ---------- Render: menú lateral ---------- */
function renderGradeMenu(){
  const el = document.getElementById("grade-menu");
  let html = `<button class="grade-item all ${activeGrade==="Todos"?"active":""}" data-g="Todos">
      Todos los grados <span class="n">${DATA.length}</span></button>`;

  GRADE_MENU.forEach(nivel=>{
    html += `<div class="nivel">${nivel.nivel}</div>`;
    nivel.grupos.forEach(grupo=>{
      if(grupo.nombre) html += `<div class="grupo">${grupo.nombre}</div>`;
      html += `<div class="grados">`;
      grupo.grados.forEach(g=>{
        const n = countForGrade(g);
        html += `<button class="grade-item ${activeGrade===g?"active":""}" data-g="${g}">
            ${g} <span class="n">${n}</span></button>`;
      });
      html += `</div>`;
    });
  });
  el.innerHTML = html;

  el.querySelectorAll(".grade-item").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      activeGrade = btn.dataset.g;
      document.getElementById("sidebar-toggle-label").textContent =
        activeGrade === "Todos" ? "Grados" : activeGrade;
      document.querySelector(".sidebar").classList.remove("open");
      render();
      if(window.innerWidth <= 860){
        document.querySelector(".content").scrollIntoView({behavior:"smooth", block:"start"});
      }
    });
  });
}

/* ---------- Render: filtro de categorías ---------- */
function renderCatTabs(){
  const base = DATA.filter(d => activeGrade==="Todos" || d.grados.includes(activeGrade));
  const counts = {};
  base.forEach(d=> counts[d.categoria] = (counts[d.categoria]||0)+1);

  const el = document.getElementById("cat-tabs");
  let html = `<button class="cat-tab ${activeCategory==="Todas"?"active":""}" data-c="Todas">Todas <span class="n">${base.length}</span></button>`;
  CATEGORY_ORDER.forEach(cat=>{
    const n = counts[cat] || 0;
    if(n === 0) return;
    html += `<button class="cat-tab ${activeCategory===cat?"active":""}" data-c="${cat}"
        style="--group-color:${CATEGORY_COLORS[cat]}">${cat} <span class="n">${n}</span></button>`;
  });
  el.innerHTML = html;

  el.querySelectorAll(".cat-tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{ activeCategory = btn.dataset.c; render(); });
  });
}

function matchesQuery(d){
  if(!query) return true;
  const q = query.toLowerCase();
  return (d.documento+" "+d.fuente+" "+d.codigo).toLowerCase().includes(q);
}

function renderCard(d){
  const savedVal = links[d.id] || "";
  const valid = isValidUrl(savedVal);
  return `
    <div class="card" style="--group-color:${CATEGORY_COLORS[d.categoria]}">
      <p class="card-source">${d.fuente}</p>
      <p class="card-title">${d.documento}</p>
      <p class="card-sub">${d.codigo} · ${d.origen} · Grado: ${d.grado}</p>
      <div class="card-footer">
        <a class="view-link ${valid?'':'pending'}" href="${valid?savedVal:'#'}" target="_blank" rel="noopener">
          ${valid ? 'Ver recurso ↗️' : 'Enlace pendiente'}
        </a>
        <div class="edit-row">
          <input type="text" class="link-input ${valid?'saved':''}" data-id="${d.id}" placeholder="Pega el enlace…" value="${savedVal.replace(/"/g,'&quot;')}">
        </div>
      </div>
    </div>
  `;
}

function render(){
  renderGradeMenu();
  renderCatTabs();

  const filtered = DATA.filter(d=>
    (activeGrade==="Todos" || d.grados.includes(activeGrade)) &&
    (activeCategory==="Todas" || d.categoria===activeCategory) &&
    matchesQuery(d)
  );

  const main = document.getElementById("main");
  const empty = document.getElementById("empty");
  if(filtered.length===0){ main.innerHTML=""; empty.style.display="block"; return; }
  empty.style.display="none";

  const groups = {};
  filtered.forEach(d=>{ groups[d.categoria]=groups[d.categoria]||[]; groups[d.categoria].push(d); });

  let html = `<p class="result-head">${activeGrade==="Todos" ? "Todos los grados" : activeGrade} ·
      ${filtered.length} recurso${filtered.length===1?"":"s"}</p>`;

  CATEGORY_ORDER.forEach(cat=>{
    const items = groups[cat];
    if(!items || items.length===0) return;
    html += `
      <section class="cat-group">
        <div class="cat-head" style="--group-color:${CATEGORY_COLORS[cat]}">
          <h2>${cat}</h2>
          <span class="count">${items.length} recurso${items.length===1?'':'s'}</span>
        </div>
        <div class="grid">${items.map(renderCard).join("")}</div>
      </section>
    `;
  });
  main.innerHTML = html;

  main.querySelectorAll(".link-input").forEach(inp=>{
    inp.addEventListener("input", (e)=>{
      const id = e.target.dataset.id;
      links[id] = e.target.value.trim();
      const valid = isValidUrl(e.target.value);
      e.target.classList.toggle("saved", valid);
      const card = e.target.closest(".card");
      const viewLink = card.querySelector(".view-link");
      viewLink.href = valid ? e.target.value.trim() : "#";
      viewLink.classList.toggle("pending", !valid);
      viewLink.textContent = valid ? "Ver recurso ↗️" : "Enlace pendiente";
    });
  });
}

  editMode = !editMode;
  document.body.classList.toggle("edit-mode", editMode);
  e.target.classList.toggle("on", editMode);
  e.target.textContent = editMode ? "Salir de edición" : "Editar enlaces";
});

document.getElementById("btn-export").addEventListener("click", ()=>{
  const exportData = DATA.map(d=>({
    documento:d.documento, codigo:d.codigo, fuente:d.fuente, grado:d.grado, link: links[d.id]||""
  }));
  const blob = new Blob([JSON.stringify(exportData,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download="enlaces_recursos_socioemocionales.json"; a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("btn-import").addEventListener("click", ()=> document.getElementById("file-input").click());
document.getElementById("file-input").addEventListener("change",(e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload=(ev)=>{
    try{
      const imported = JSON.parse(ev.target.result);
      imported.forEach(item=>{
        const match = DATA.find(d=>d.documento===item.documento && d.codigo===item.codigo && d.fuente===item.fuente);
        if(match && item.link) links[match.id]=item.link;
      });
      render();
    }catch(err){
      alert("No se pudo leer el archivo. Debe ser el .json exportado desde esta misma página.");
    }
  };
  reader.readAsText(file);
  e.target.value="";
});

function checkAdminAccess(){
  const params = new URLSearchParams(window.location.search);
  if(!params.has('admin')) return false;
  const entered = prompt('Contraseña de administrador:');
  if(entered === ADMIN_PASSWORD) return true;
  if(entered !== null) alert('Contraseña incorrecta.');
  return false;
}

if(checkAdminAccess()){
  document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
  document.getElementById('admin-hint').style.display = 'block';
}

render();

});
</script>
</body>
</html>
