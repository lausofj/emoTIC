<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2"/>
      <stop offset="50%" stop-color="#5C6BC0"/>
      <stop offset="100%" stop-color="#7E57C2"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </radialGradient>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect x="0" y="0" width="192" height="192" rx="42" fill="url(#bg)"/>

  <!-- Glowing Heart-Star / Emotion Core -->
  <circle cx="96" cy="85" r="48" fill="url(#starGlow)"/>

  <!-- Character Eyes -->
  <ellipse cx="80" cy="82" rx="7" ry="10" fill="#212121"/>
  <ellipse cx="112" cy="82" rx="7" ry="10" fill="#212121"/>
  <circle cx="78" cy="78" r="3" fill="#FFFFFF"/>
  <circle cx="110" cy="78" r="3" fill="#FFFFFF"/>

  <!-- Joyful Smile -->
  <path d="M 85 96 Q 96 108 107 96" stroke="#5D4037" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Rosy cheeks -->
  <circle cx="72" cy="95" r="5" fill="#FF8A80"/>
  <circle cx="120" cy="95" r="5" fill="#FF8A80"/>

  <!-- Sparks -->
  <polygon points="96,20 100,28 108,30 101,35 103,43 96,38 89,43 91,35 84,30 92,28" fill="#FFD54F"/>

  <!-- Brand Label emoTIC -->
  <text x="96" y="162" font-family="'Nunito', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">emoTIC</text>
</svg>
