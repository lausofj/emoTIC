<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="1"/>
      <stop offset="70%" stop-color="#FFB300" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bodyGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="40%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#E65100" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="100" cy="100" r="92" fill="url(#glow)" opacity="0.45"/>

  <!-- Little Sparkles -->
  <circle cx="35" cy="45" r="4" fill="#FFD54F" opacity="0.8"/>
  <circle cx="165" cy="40" r="5" fill="#FFE082" opacity="0.9"/>
  <circle cx="170" cy="140" r="4" fill="#FFCA28" opacity="0.7"/>
  <circle cx="30" cy="130" r="3" fill="#FFE082" opacity="0.6"/>

  <!-- Antenna / Spark -->
  <path d="M 100 50 Q 100 22 108 14" stroke="#FFA000" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <circle cx="110" cy="12" r="7" fill="#FF5252" filter="url(#softShadow)"/>
  <circle cx="109" cy="10" r="2.5" fill="#FFFFFF"/>

  <!-- Wings -->
  <path d="M 58 102 C 25 80 20 120 54 118 Z" fill="#B3E5FC" opacity="0.85" stroke="#81D4FA" stroke-width="2"/>
  <path d="M 142 102 C 175 80 180 120 146 118 Z" fill="#B3E5FC" opacity="0.85" stroke="#81D4FA" stroke-width="2"/>

  <!-- Body -->
  <ellipse cx="100" cy="108" rx="50" ry="46" fill="url(#bodyGrad)" filter="url(#softShadow)"/>

  <!-- Soft Cheeks -->
  <ellipse cx="72" cy="116" rx="9" ry="6" fill="#FF8A80" opacity="0.65"/>
  <ellipse cx="128" cy="116" rx="9" ry="6" fill="#FF8A80" opacity="0.65"/>

  <!-- Big Friendly Eyes -->
  <ellipse cx="80" cy="98" rx="10" ry="13" fill="#263238"/>
  <ellipse cx="120" cy="98" rx="10" ry="13" fill="#263238"/>
  <!-- Highlights -->
  <circle cx="77" cy="93" r="4.5" fill="#FFFFFF"/>
  <circle cx="83" cy="103" r="1.8" fill="#FFFFFF"/>
  <circle cx="117" cy="93" r="4.5" fill="#FFFFFF"/>
  <circle cx="123" cy="103" r="1.8" fill="#FFFFFF"/>

  <!-- Cute Warm Smile -->
  <path d="M 88 116 Q 100 128 112 116" stroke="#5D4037" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Explorer Scarf / Heart Medal -->
  <path d="M 80 146 Q 100 156 120 146 Q 128 156 118 162 Q 100 166 82 162 Z" fill="#29B6F6"/>
  <path d="M 94 152 L 100 162 L 106 152" fill="#0288D1"/>
  <!-- Heart emblem -->
  <circle cx="100" cy="154" r="5" fill="#FF5252"/>
</svg>
