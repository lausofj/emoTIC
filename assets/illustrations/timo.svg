<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="timoAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#6EE7B7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="timoBody" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="45%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <linearGradient id="timoLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="timoScarf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="timoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#065F46" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Aura mágica del bosque -->
  <circle cx="120" cy="120" r="105" fill="url(#timoAura)"/>

  <!-- Destellos y hojitas mágicas flotantes -->
  <circle cx="45" cy="55" r="4" fill="#34D399" opacity="0.8"/>
  <circle cx="195" cy="50" r="5" fill="#6EE7B7" opacity="0.9"/>
  <circle cx="205" cy="165" r="3.5" fill="#10B981" opacity="0.7"/>
  <circle cx="35" cy="160" r="4" fill="#A7F3D0" opacity="0.8"/>

  <g id="timo-character" filter="url(#timoShadow)">
    <!-- Patitas de Timo -->
    <ellipse cx="98" cy="202" rx="16" ry="12" fill="#D97706"/>
    <ellipse cx="142" cy="202" rx="16" ry="12" fill="#D97706"/>
    <ellipse cx="98" cy="200" rx="14" ry="10" fill="#F59E0B"/>
    <ellipse cx="142" cy="200" rx="14" ry="10" fill="#F59E0B"/>

    <!-- Brazos de Timo -->
    <!-- Brazo izquierdo saludando alegremente hacia arriba -->
    <path d="M 72 135 C 50 120 40 95 52 88 C 64 82 78 108 82 125 Z" fill="#F59E0B"/>
    <circle cx="50" cy="90" r="10" fill="#FBBF24"/>

    <!-- Brazo derecho abierto invitando con calidez -->
    <path d="M 168 135 C 190 125 200 105 188 98 C 176 92 162 115 158 128 Z" fill="#F59E0B"/>
    <circle cx="190" cy="100" r="10" fill="#FBBF24"/>

    <!-- Cuerpo esponjoso de Timo -->
    <ellipse cx="120" cy="148" rx="52" ry="56" fill="url(#timoBody)"/>

    <!-- Pancita suave clara -->
    <ellipse cx="120" cy="156" rx="34" ry="36" fill="#FFFBEB" opacity="0.85"/>

    <!-- Orejitas tiernas de Timo -->
    <!-- Oreja izquierda -->
    <path d="M 74 76 C 58 52 64 32 80 42 C 94 50 88 74 82 78 Z" fill="#F59E0B"/>
    <path d="M 75 70 C 65 54 70 42 78 48 C 84 53 82 68 78 72 Z" fill="#FCA5A5" opacity="0.75"/>

    <!-- Oreja derecha -->
    <path d="M 166 76 C 182 52 176 32 160 42 C 146 50 152 74 158 78 Z" fill="#F59E0B"/>
    <path d="M 165 70 C 175 54 170 42 162 48 C 156 53 158 68 162 72 Z" fill="#FCA5A5" opacity="0.75"/>

    <!-- Cabeza redonda y simpática -->
    <ellipse cx="120" cy="98" rx="48" ry="44" fill="url(#timoBody)"/>

    <!-- Antena con hojita mágica de las emociones -->
    <path d="M 120 54 Q 120 28 128 20" stroke="#059669" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Brote de hoja en la punta -->
    <path d="M 128 20 C 138 12 152 16 148 28 C 144 38 130 30 128 20 Z" fill="url(#timoLeaf)"/>
    <circle cx="140" cy="22" r="2.5" fill="#A7F3D0"/>

    <!-- Ojos grandes, brillantes y curiosos -->
    <ellipse cx="99" cy="94" rx="9.5" ry="12.5" fill="#1E293B"/>
    <ellipse cx="141" cy="94" rx="9.5" ry="12.5" fill="#1E293B"/>

    <!-- Brillos de curiosidad en los ojos -->
    <circle cx="96" cy="89" r="4.5" fill="#FFFFFF"/>
    <circle cx="102" cy="99" r="2" fill="#FFFFFF"/>
    <circle cx="138" cy="89" r="4.5" fill="#FFFFFF"/>
    <circle cx="144" cy="99" r="2" fill="#FFFFFF"/>

    <!-- Naricita de corazón -->
    <path d="M 120 109 C 117 106 114 104 114 102 C 114 99.5 116 98 118 98 C 119.5 98 120 99 120 99.5 C 120 99 120.5 98 122 98 C 124 98 126 99.5 126 102 C 126 104 123 106 120 109 Z" fill="#EF4444"/>

    <!-- Gran sonrisa alegre y abierta -->
    <path d="M 106 114 Q 120 128 134 114" stroke="#78350F" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M 112 118 Q 120 126 128 118 Z" fill="#F87171"/>

    <!-- Mejillas sonrosadas de felicidad -->
    <ellipse cx="86" cy="107" rx="8" ry="5.5" fill="#FB7185" opacity="0.6"/>
    <ellipse cx="154" cy="107" rx="8" ry="5.5" fill="#FB7185" opacity="0.6"/>

    <!-- Bufanda / Pañoleta de explorador del bosque -->
    <path d="M 88 132 Q 120 144 152 132 Q 158 140 150 146 Q 120 156 90 146 Z" fill="url(#timoScarf)"/>
    <!-- Nudo de la bufanda colgando -->
    <path d="M 114 142 L 110 162 L 122 165 L 124 144 Z" fill="#047857"/>
    <circle cx="118" cy="144" r="5" fill="#FBBF24"/>
  </g>
</svg>