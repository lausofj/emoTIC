<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- Sun in imagination sky -->
  <circle cx="205" cy="40" r="30" fill="url(#sunGrad)"/>
  <circle cx="205" cy="40" r="16" fill="#FDD835"/>

  <!-- Swing Ropes -->
  <line x1="65" y1="0" x2="78" y2="175" stroke="#8D6E63" stroke-width="4" stroke-dasharray="4 2"/>
  <line x1="165" y1="0" x2="152" y2="175" stroke="#8D6E63" stroke-width="4" stroke-dasharray="4 2"/>

  <!-- Flowers floating around (imagination) -->
  <g transform="translate(30, 80)">
    <circle cx="0" cy="0" r="10" fill="#FF80AB" opacity="0.8"/>
    <circle cx="0" cy="0" r="4" fill="#FFEB3B"/>
  </g>
  <g transform="translate(195, 120)">
    <circle cx="0" cy="0" r="12" fill="#BA68C8" opacity="0.8"/>
    <circle cx="0" cy="0" r="5" fill="#FFEB3B"/>
  </g>

  <!-- Gina Hair Back -->
  <path d="M 85 90 C 70 140 85 180 120 185 C 150 180 165 140 150 90 Z" fill="#6D4C41"/>

  <!-- Body / Dress -->
  <path d="M 98 135 L 85 185 L 145 185 L 132 135 Z" fill="#FF7043"/>
  <path d="M 85 185 Q 115 195 145 185" fill="#F4511E"/>

  <!-- Legs sitting on swing -->
  <path d="M 95 185 L 90 230" stroke="#FFCCBC" stroke-width="12" stroke-linecap="round"/>
  <path d="M 130 185 L 135 230" stroke="#FFCCBC" stroke-width="12" stroke-linecap="round"/>
  <!-- Shoes -->
  <ellipse cx="88" cy="235" rx="9" ry="6" fill="#D81B60"/>
  <ellipse cx="137" cy="235" rx="9" ry="6" fill="#D81B60"/>

  <!-- Wooden Swing Seat -->
  <rect x="66" y="176" width="98" height="12" rx="5" fill="#8D6E63" stroke="#5D4037" stroke-width="2"/>

  <!-- Arms -->
  <path d="M 95 140 Q 80 150 78 160" stroke="#FFCCBC" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Left hand holding rope -->
  <circle cx="78" cy="160" r="6" fill="#FFCCBC"/>

  <!-- Right Arm holding Ice Cream -->
  <path d="M 132 140 Q 150 145 152 130" stroke="#FFCCBC" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Delicious Ice Cream Cone -->
  <polygon points="152,135 162,135 157,155" fill="#D7CCC8" stroke="#8D6E63" stroke-width="1"/>
  <circle cx="157" cy="130" r="8" fill="#F48FB1"/>
  <circle cx="157" cy="122" r="6" fill="#FFF59D"/>

  <!-- Head & Face -->
  <ellipse cx="115" cy="98" rx="28" ry="26" fill="#FFCCBC"/>

  <!-- Hair Bangs Front -->
  <path d="M 87 90 C 95 72 135 72 143 90 C 130 84 100 84 87 90 Z" fill="#5D4037"/>

  <!-- Eyes (Happy and Peaceful) -->
  <ellipse cx="104" cy="98" rx="5.5" ry="7" fill="#3E2723"/>
  <ellipse cx="126" cy="98" rx="5.5" ry="7" fill="#3E2723"/>
  <circle cx="102" cy="95" r="2.5" fill="#FFFFFF"/>
  <circle cx="124" cy="95" r="2.5" fill="#FFFFFF"/>

  <!-- Cheeks & Happy Smile -->
  <ellipse cx="96" cy="107" rx="5" ry="3.5" fill="#FF8A80" opacity="0.7"/>
  <ellipse cx="134" cy="107" rx="5" ry="3.5" fill="#FF8A80" opacity="0.7"/>
  <path d="M 110 108 Q 115 116 120 108" stroke="#D84315" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
