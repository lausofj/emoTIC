<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="ninoBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="60%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </radialGradient>
    <linearGradient id="ninoHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado suave verde esmeralda -->
  <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#ninoBg)"/>

  <!-- Destellos de alegría -->
  <polygon points="102,18 104,24 110,26 104,28 102,34 100,28 94,26 100,24" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="20" cy="22" r="3" fill="#FFFFFF" opacity="0.8"/>

  <!-- Cuello y Camisa azul celeste -->
  <rect x="52" y="86" width="16" height="14" fill="#FDE68A" rx="3"/>
  <path d="M 34 98 L 44 120 L 76 120 L 86 98 Z" fill="#0284C7"/>
  <!-- Cuello redondo de la camiseta -->
  <path d="M 48 98 Q 60 106 72 98" stroke="#38BDF8" stroke-width="3" fill="none"/>

  <!-- Cabeza y rostro -->
  <ellipse cx="60" cy="58" rx="27" ry="25" fill="#FDE68A"/>

  <!-- Orejitas -->
  <ellipse cx="33" cy="60" rx="5" ry="6" fill="#FDE68A"/>
  <ellipse cx="87" cy="60" rx="5" ry="6" fill="#FDE68A"/>

  <!-- Cabello moderno peinado hacia un lado con mechón -->
  <path d="M 33 50 C 30 30 46 22 62 25 C 78 28 88 34 87 50 C 82 42 74 38 60 40 C 48 42 38 46 33 50 Z" fill="url(#ninoHair)"/>
  <!-- Mechoncito simpático -->
  <path d="M 58 26 C 64 16 76 20 74 28 Z" fill="url(#ninoHair)"/>

  <!-- Ojos alegres cerrados en arco feliz (^_^) -->
  <path d="M 44 58 Q 50 51 56 58" stroke="#1E1022" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 64 58 Q 70 51 76 58" stroke="#1E1022" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Mejillas rosadas -->
  <ellipse cx="41" cy="66" rx="6" ry="4" fill="#FB7185" opacity="0.75"/>
  <ellipse cx="79" cy="66" rx="6" ry="4" fill="#FB7185" opacity="0.75"/>

  <!-- Naricita y Sonrisa radiante abierta -->
  <circle cx="60" cy="63" r="1.5" fill="#D97706"/>
  <path d="M 52 68 Q 60 80 68 68 Z" fill="#EF4444"/>
  <path d="M 54 69 Q 60 74 66 69" fill="#FFFFFF"/>
</svg>