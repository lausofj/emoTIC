<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <filter id="chibiShadowG" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1E293B" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sombra en el suelo -->
  <ellipse cx="80" cy="210" rx="42" ry="7" fill="#CBD5E1" opacity="0.6"/>

  <g id="chibi-girl" filter="url(#chibiShadowG)">
    <!-- Piernas y Zapatos -->
    <!-- Pierna izquierda -->
    <rect x="62" y="152" width="12" height="36" rx="5" fill="#FDE68A"/>
    <!-- Zapato izquierdo rojo -->
    <ellipse cx="68" cy="192" rx="11" ry="7" fill="#E11D48"/>
    <ellipse cx="68" cy="190" rx="9" ry="4" fill="#FB7185"/>

    <!-- Pierna derecha -->
    <rect x="86" y="152" width="12" height="36" rx="5" fill="#FDE68A"/>
    <!-- Zapato derecho rojo -->
    <ellipse cx="92" cy="192" rx="11" ry="7" fill="#E11D48"/>
    <ellipse cx="92" cy="190" rx="9" ry="4" fill="#FB7185"/>

    <!-- Falda / Overol amarillo con tirantes -->
    <path d="M 54 130 L 106 130 L 112 160 L 48 160 Z" fill="#F59E0B"/>
    <!-- Tirantes del overol -->
    <rect x="62" y="94" width="8" height="36" fill="#D97706"/>
    <rect x="90" y="94" width="8" height="36" fill="#D97706"/>
    <circle cx="66" cy="132" r="2.5" fill="#FDE68A"/>
    <circle cx="94" cy="132" r="2.5" fill="#FDE68A"/>

    <!-- Blusa blanca -->
    <path d="M 54 88 L 106 88 L 104 130 L 56 130 Z" fill="#FFFFFF"/>
    <!-- Cuello de la blusa -->
    <path d="M 70 88 Q 80 96 90 88" stroke="#FBBF24" stroke-width="2.5" fill="none"/>

    <!-- Brazos con manitas de chibi -->
    <!-- Brazo izquierdo -->
    <path d="M 54 90 C 44 98 42 116 48 128 C 52 130 58 126 58 120 C 56 112 56 102 60 96 Z" fill="#FFFFFF"/>
    <circle cx="49" cy="128" r="7" fill="#FDE68A"/>

    <!-- Brazo derecho saludando alegremente -->
    <path d="M 106 90 C 118 96 122 112 114 126 C 110 128 104 124 104 118 C 105 110 104 102 100 96 Z" fill="#FFFFFF"/>
    <circle cx="113" cy="126" r="7" fill="#FDE68A"/>

    <!-- Cuello -->
    <rect x="73" y="74" width="14" height="16" fill="#FDE68A" rx="3"/>

    <!-- Cabello con coletas laterales -->
    <path d="M 40 50 C 26 62 28 84 38 88 C 42 80 42 68 46 58 Z" fill="#3B1C32"/>
    <path d="M 120 50 C 134 62 132 84 122 88 C 118 80 118 68 114 58 Z" fill="#3B1C32"/>

    <!-- Cabeza chibi -->
    <ellipse cx="80" cy="56" rx="32" ry="29" fill="#FDE68A"/>

    <!-- Orejitas -->
    <ellipse cx="48" cy="58" rx="6" ry="7" fill="#FDE68A"/>
    <ellipse cx="112" cy="58" rx="6" ry="7" fill="#FDE68A"/>

    <!-- Cabello oscuro frontal con flequillo -->
    <path d="M 48 52 C 45 28 62 18 80 20 C 98 22 114 30 112 52 C 106 42 96 38 80 40 C 66 42 54 46 48 52 Z" fill="#3B1C32"/>

    <!-- Sombrero de exploradora (fiel a la foto) -->
    <g id="avatar-hat-group-nina">
      <!-- Ala ancha del sombrero -->
      <ellipse cx="80" cy="34" rx="42" ry="14" fill="#92400E"/>
      <!-- Copa del sombrero -->
      <path d="M 54 32 C 54 12 64 6 80 6 C 96 6 106 12 106 32 Z" fill="#B45309"/>
      <!-- Hendidura superior -->
      <path d="M 68 8 Q 80 16 92 8" stroke="#78350F" stroke-width="3" fill="none"/>
      <!-- Cinta del sombrero rosada -->
      <rect x="54" y="26" width="52" height="6" rx="2" fill="#E11D48"/>
      <circle cx="80" cy="29" r="4" fill="#FEF08A"/>
    </g>

    <!-- Rostro amigable: Ojos brillantes y curiosos -->
    <ellipse cx="68" cy="57" rx="4.5" ry="5.5" fill="#1E293B"/>
    <ellipse cx="92" cy="57" rx="4.5" ry="5.5" fill="#1E293B"/>
    <circle cx="66.5" cy="54.5" r="1.8" fill="#FFFFFF"/>
    <circle cx="90.5" cy="54.5" r="1.8" fill="#FFFFFF"/>

    <!-- Mejillas sonrosadas -->
    <ellipse cx="58" cy="65" rx="6" ry="4" fill="#FB7185" opacity="0.65"/>
    <ellipse cx="102" cy="65" rx="6" ry="4" fill="#FB7185" opacity="0.65"/>

    <!-- Sonrisa dulce -->
    <path d="M 73 66 Q 80 73 87 66" stroke="#92400E" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>
</svg>