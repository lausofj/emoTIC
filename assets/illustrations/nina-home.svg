<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="ninaBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="60%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </radialGradient>
    <linearGradient id="ninaHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B1C32"/>
      <stop offset="100%" stop-color="#1E1022"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado suave melocotón/coral -->
  <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#ninaBg)"/>

  <!-- Destellos de alegría -->
  <polygon points="102,18 104,24 110,26 104,28 102,34 100,28 94,26 100,24" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="20" cy="22" r="3" fill="#FFFFFF" opacity="0.8"/>

  <!-- Cabello posterior -->
  <ellipse cx="60" cy="62" rx="36" ry="34" fill="url(#ninaHair)"/>
  <path d="M 24 64 C 20 84 26 104 36 108 C 38 96 34 82 34 70 Z" fill="url(#ninaHair)"/>
  <path d="M 96 64 C 100 84 94 104 84 108 C 82 96 86 82 86 70 Z" fill="url(#ninaHair)"/>

  <!-- Cuello y Blusa con overol amarillo -->
  <rect x="52" y="86" width="16" height="14" fill="#FDE68A" rx="3"/>
  <path d="M 36 98 L 44 120 L 76 120 L 84 98 Z" fill="#F59E0B"/>
  <path d="M 46 96 L 52 120 L 68 120 L 74 96 Z" fill="#FCD34D"/>
  <!-- Cuello blanco de la camisa -->
  <polygon points="60,98 50,88 60,92 70,88" fill="#FFFFFF"/>

  <!-- Cabeza y rostro -->
  <ellipse cx="60" cy="58" rx="27" ry="25" fill="#FDE68A"/>

  <!-- Flequillo peinado y orejitas -->
  <ellipse cx="33" cy="60" rx="5" ry="6" fill="#FDE68A"/>
  <ellipse cx="87" cy="60" rx="5" ry="6" fill="#FDE68A"/>
  <!-- Flequillo curvado -->
  <path d="M 33 52 C 38 34 52 32 60 38 C 68 32 82 34 87 52 C 80 44 70 44 60 47 C 50 44 40 44 33 52 Z" fill="url(#ninaHair)"/>

  <!-- Broches para el cabello rosados -->
  <circle cx="36" cy="42" r="3.5" fill="#F43F5E"/>
  <circle cx="84" cy="42" r="3.5" fill="#F43F5E"/>

  <!-- Ojos alegres cerrados en arco feliz (^_^) -->
  <path d="M 44 58 Q 50 51 56 58" stroke="#1E1022" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 64 58 Q 70 51 76 58" stroke="#1E1022" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Mejillas rosadas sonrosadas -->
  <ellipse cx="41" cy="66" rx="6" ry="4" fill="#FB7185" opacity="0.75"/>
  <ellipse cx="79" cy="66" rx="6" ry="4" fill="#FB7185" opacity="0.75"/>

  <!-- Naricita y Sonrisa radiante abierta -->
  <circle cx="60" cy="63" r="1.5" fill="#D97706"/>
  <path d="M 52 68 Q 60 80 68 68 Z" fill="#EF4444"/>
  <path d="M 54 69 Q 60 74 66 69" fill="#FFFFFF"/>
</svg>