<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <filter id="chibiShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1E293B" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sombra en el suelo -->
  <ellipse cx="80" cy="210" rx="42" ry="7" fill="#CBD5E1" opacity="0.6"/>

  <g id="chibi-boy" filter="url(#chibiShadow)">
    <!-- Piernas y Zapatos -->
    <!-- Pierna izquierda -->
    <rect x="62" y="152" width="12" height="36" rx="5" fill="#FDE68A"/>
    <!-- Zapato izquierdo -->
    <ellipse cx="68" cy="192" rx="11" ry="7" fill="#0284C7"/>
    <ellipse cx="68" cy="190" rx="9" ry="4" fill="#38BDF8"/>

    <!-- Pierna derecha -->
    <rect x="86" y="152" width="12" height="36" rx="5" fill="#FDE68A"/>
    <!-- Zapato derecho -->
    <ellipse cx="92" cy="192" rx="11" ry="7" fill="#0284C7"/>
    <ellipse cx="92" cy="190" rx="9" ry="4" fill="#38BDF8"/>

    <!-- Pantalón corto / Shorts azul marino -->
    <path d="M 56 134 L 104 134 L 102 160 L 84 160 L 80 148 L 76 160 L 58 160 Z" fill="#1E3A8A"/>
    <!-- Cinturón marrón -->
    <rect x="56" y="132" width="48" height="6" rx="2" fill="#78350F"/>
    <rect x="76" y="131" width="8" height="8" rx="2" fill="#FBBF24"/>

    <!-- Torso / Camiseta azul brillante -->
    <path d="M 54 88 L 106 88 L 104 134 L 56 134 Z" fill="#0284C7"/>
    <!-- Cuello de la camiseta -->
    <path d="M 70 88 Q 80 96 90 88" stroke="#38BDF8" stroke-width="3" fill="none"/>

    <!-- Brazos con manitas de chibi -->
    <!-- Brazo izquierdo -->
    <path d="M 54 90 C 44 98 42 116 48 128 C 52 130 58 126 58 120 C 56 112 56 102 60 96 Z" fill="#0284C7"/>
    <circle cx="49" cy="128" r="7" fill="#FDE68A"/>

    <!-- Brazo derecho saludando alegremente -->
    <path d="M 106 90 C 118 96 122 112 114 126 C 110 128 104 124 104 118 C 105 110 104 102 100 96 Z" fill="#0284C7"/>
    <circle cx="113" cy="126" r="7" fill="#FDE68A"/>

    <!-- Cuello -->
    <rect x="73" y="74" width="14" height="16" fill="#FDE68A" rx="3"/>

    <!-- Cabeza chibi grande y adorable -->
    <ellipse cx="80" cy="56" rx="32" ry="29" fill="#FDE68A"/>

    <!-- Orejitas -->
    <ellipse cx="48" cy="58" rx="6" ry="7" fill="#FDE68A"/>
    <ellipse cx="112" cy="58" rx="6" ry="7" fill="#FDE68A"/>

    <!-- Cabello castaño -->
    <path d="M 48 52 C 45 28 62 18 80 20 C 98 22 114 30 112 52 C 106 42 96 38 80 40 C 66 42 54 46 48 52 Z" fill="#5D4037"/>

    <!-- Sombrero de explorador / aventurero (fiel a la foto) -->
    <g id="avatar-hat-group">
      <!-- Ala ancha del sombrero -->
      <ellipse cx="80" cy="34" rx="42" ry="14" fill="#92400E"/>
      <!-- Copa del sombrero -->
      <path d="M 54 32 C 54 12 64 6 80 6 C 96 6 106 12 106 32 Z" fill="#B45309"/>
      <!-- Hendidura superior del sombrero fedora/explorador -->
      <path d="M 68 8 Q 80 16 92 8" stroke="#78350F" stroke-width="3" fill="none"/>
      <!-- Cinta del sombrero dorada -->
      <rect x="54" y="26" width="52" height="6" rx="2" fill="#D97706"/>
      <rect x="53" y="28" width="54" height="2" fill="#FBBF24"/>
    </g>

    <!-- Rostro amigable: Ojos brillantes y curiosos -->
    <ellipse cx="68" cy="57" rx="4.5" ry="5.5" fill="#1E293B"/>
    <ellipse cx="92" cy="57" rx="4.5" ry="5.5" fill="#1E293B"/>
    <circle cx="66.5" cy="54.5" r="1.8" fill="#FFFFFF"/>
    <circle cx="90.5" cy="54.5" r="1.8" fill="#FFFFFF"/>

    <!-- Mejillas sonrosadas -->
    <ellipse cx="58" cy="65" rx="6" ry="4" fill="#FB7185" opacity="0.6"/>
    <ellipse cx="102" cy="65" rx="6" ry="4" fill="#FB7185" opacity="0.6"/>

    <!-- Sonrisa simpática -->
    <path d="M 73 66 Q 80 73 87 66" stroke="#92400E" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>
</svg>