<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capeGradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="capeGradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="suitHeroine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="suitHero" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="heroShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E293B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Aura mágica de superhéroes -->
  <circle cx="160" cy="140" r="130" fill="url(#heroGlow)"/>

  <!-- Destellos y estrellas de superhéroes -->
  <polygon points="160,18 164,30 176,34 164,38 160,50 156,38 144,34 156,30" fill="#F59E0B"/>
  <polygon points="40,90 43,98 52,101 43,104 40,112 37,104 28,101 37,98" fill="#FBBF24"/>
  <polygon points="280,95 283,103 292,106 283,109 280,117 277,109 268,106 277,103" fill="#FBBF24"/>

  <!-- ============================================== -->
  <!-- 1. HÉROE (NIÑO - LADO IZQUIERDO) -->
  <!-- ============================================== -->
  <g id="superhero-boy" transform="translate(10, 0)">
    <!-- Capa roja ondeante -->
    <path d="M 68 122 C 30 140 22 210 38 238 C 58 245 82 220 86 170 Z" fill="url(#capeGradRed)" filter="url(#heroShadow)"/>

    <!-- Piernas / Botas rojas -->
    <rect x="76" y="210" width="18" height="34" rx="9" fill="#DC2626"/>
    <rect x="104" y="210" width="18" height="34" rx="9" fill="#DC2626"/>

    <!-- Torso con traje azul y emblema dorado de rayo/estrella -->
    <path d="M 66 126 C 66 126 72 208 74 214 L 124 214 C 126 208 132 126 132 126 Z" fill="url(#suitHero)" filter="url(#heroShadow)"/>
    <rect x="72" y="196" width="54" height="10" rx="4" fill="#F59E0B"/>
    <circle cx="99" cy="201" r="7" fill="#FEF08A" stroke="#D97706" stroke-width="2"/>

    <!-- Emblema de escudo en el pecho -->
    <polygon points="99,145 113,153 108,172 99,180 90,172 85,153" fill="#FEF08A" stroke="#F59E0B" stroke-width="2"/>
    <polygon points="101,152 94,163 99,163 97,173 105,161 100,161" fill="#DC2626"/>

    <!-- Brazos con guantes rojos -->
    <!-- Brazo izquierdo extendido en señal de ayuda -->
    <path d="M 68 132 C 50 148 42 166 48 184 C 54 186 64 176 68 160 Z" fill="#0284C7"/>
    <circle cx="48" cy="184" r="9" fill="#DC2626"/>

    <!-- Brazo derecho en la cintura con pose de héroe -->
    <path d="M 130 132 C 144 146 142 168 132 176 C 126 172 124 158 126 146 Z" fill="#0284C7"/>
    <circle cx="132" cy="176" r="9" fill="#DC2626"/>

    <!-- Cuello -->
    <rect x="91" y="112" width="16" height="18" fill="#FCD34D" rx="4"/>

    <!-- Cabeza -->
    <ellipse cx="99" cy="88" rx="28" ry="30" fill="#FDE68A"/>

    <!-- Cabello castaño corto y peinado hacia arriba -->
    <path d="M 68 85 C 66 52 90 42 115 48 C 128 52 134 68 130 84 C 126 78 122 72 110 72 C 95 72 88 80 84 84 Z" fill="#6B4226"/>

    <!-- Antifaz azul de héroe (fiel al estilo) -->
    <path d="M 73 82 C 78 74 92 74 97 82 C 102 74 116 74 121 82 C 123 92 115 97 97 97 C 79 97 71 92 73 82 Z" fill="#0284C7" stroke="#0369A1" stroke-width="2"/>
    <!-- Ojos dentro del antifaz -->
    <ellipse cx="86" cy="85" rx="5.5" ry="6.5" fill="#FFFFFF"/>
    <circle cx="87" cy="85" r="3.5" fill="#1E293B"/>
    <circle cx="89" cy="83" r="1.3" fill="#FFFFFF"/>

    <ellipse cx="108" cy="85" rx="5.5" ry="6.5" fill="#FFFFFF"/>
    <circle cx="109" cy="85" r="3.5" fill="#1E293B"/>
    <circle cx="111" cy="83" r="1.3" fill="#FFFFFF"/>

    <!-- Mejillas y sonrisa de héroe -->
    <circle cx="77" cy="98" r="4.5" fill="#F87171" opacity="0.6"/>
    <circle cx="119" cy="98" r="4.5" fill="#F87171" opacity="0.6"/>
    <path d="M 92 102 Q 99 110 106 102" stroke="#78350F" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ============================================== -->
  <!-- 2. HEROÍNA (NIÑA - LADO DERECHO, ESTILO DE LA FOTO DEL USUARIO) -->
  <!-- ============================================== -->
  <g id="superhero-girl" transform="translate(5, 0)">
    <!-- Capa roja ondeante brillante -->
    <path d="M 234 122 C 272 140 280 210 264 238 C 244 245 220 220 216 170 Z" fill="url(#capeGradRed)" filter="url(#heroShadow)"/>

    <!-- Botas rojas -->
    <rect x="188" y="210" width="18" height="34" rx="9" fill="#DC2626"/>
    <rect x="216" y="210" width="18" height="34" rx="9" fill="#DC2626"/>

    <!-- Traje blanco con hombreras rojas (exacto a la imagen) -->
    <path d="M 178 126 C 178 126 184 208 186 214 L 236 214 C 238 208 244 126 244 126 Z" fill="url(#suitHeroine)" filter="url(#heroShadow)"/>
    
    <!-- Cuello/hombros rojos como en la imagen del usuario -->
    <path d="M 178 126 Q 211 144 244 126 L 240 148 Q 211 160 182 148 Z" fill="#DC2626"/>
    <polygon points="211,142 215,150 224,152 217,157 219,165 211,160 203,165 205,157 198,152 207,150" fill="#FEF08A"/>

    <!-- Cinturón amarillo dorado -->
    <rect x="184" y="196" width="54" height="10" rx="4" fill="#F59E0B"/>
    <circle cx="211" cy="201" r="7" fill="#FEF08A" stroke="#D97706" stroke-width="2"/>

    <!-- Brazos con guantes rojos -->
    <!-- Brazo izquierdo en la cintura con determinación -->
    <path d="M 180 132 C 166 146 168 168 178 176 C 184 172 186 158 184 146 Z" fill="#F1F5F9"/>
    <circle cx="178" cy="176" r="9" fill="#DC2626"/>

    <!-- Brazo derecho extendido saludando amablemente -->
    <path d="M 242 132 C 260 148 268 166 262 184 C 256 186 246 176 242 160 Z" fill="#F1F5F9"/>
    <circle cx="262" cy="184" r="9" fill="#DC2626"/>

    <!-- Cuello -->
    <rect x="203" y="112" width="16" height="18" fill="#FCD34D" rx="4"/>

    <!-- Cabeza -->
    <ellipse cx="211" cy="88" rx="28" ry="30" fill="#FDE68A"/>

    <!-- Cabello castaño ondulado con volumen (fiel a la superheroína de la foto) -->
    <path d="M 180 85 C 178 50 200 40 225 44 C 245 48 248 64 246 85 C 252 100 250 120 242 130 C 238 116 236 102 238 90 C 230 78 210 74 196 82 C 190 98 186 116 178 130 C 172 118 174 98 180 85 Z" fill="#78350F"/>

    <!-- Antifaz azul cian de superheroína (exacto a la foto adjunta) -->
    <path d="M 185 82 C 190 74 204 74 209 82 C 214 74 228 74 233 82 C 235 92 227 97 209 97 C 191 97 183 92 185 82 Z" fill="#00B4D8" stroke="#0077B6" stroke-width="2"/>
    
    <!-- Ojos de superheroína -->
    <ellipse cx="198" cy="85" rx="5.5" ry="6.5" fill="#FFFFFF"/>
    <circle cx="199" cy="85" r="3.5" fill="#1E293B"/>
    <circle cx="201" cy="83" r="1.3" fill="#FFFFFF"/>

    <ellipse cx="220" cy="85" rx="5.5" ry="6.5" fill="#FFFFFF"/>
    <circle cx="221" cy="85" r="3.5" fill="#1E293B"/>
    <circle cx="223" cy="83" r="1.3" fill="#FFFFFF"/>

    <!-- Mejillas sonrosadas y linda sonrisa -->
    <circle cx="189" cy="98" r="4.5" fill="#F87171" opacity="0.6"/>
    <circle cx="231" cy="98" r="4.5" fill="#F87171" opacity="0.6"/>
    <path d="M 204 102 Q 211 110 218 102" stroke="#78350F" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Medalla de Corazón Dorado al centro (Símbolo de la Ayuda Mutua) -->
  <g transform="translate(142, 218)">
    <circle cx="18" cy="18" r="16" fill="#F59E0B" filter="url(#heroShadow)"/>
    <circle cx="18" cy="18" r="13" fill="#FEF08A"/>
    <!-- Corazón rojo -->
    <path d="M 18 25 C 13 21 9 17 9 13.5 C 9 10.5 11.5 8 14.5 8 C 16.2 8 17.5 9 18 10 C 18.5 9 19.8 8 21.5 8 C 24.5 8 27 10.5 27 13.5 C 27 17 23 21 18 25 Z" fill="#EF4444"/>
  </g>
</svg>