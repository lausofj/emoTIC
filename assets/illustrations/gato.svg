<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Gato Presentador - Emociones para la Vida (Alegre) -->
  <defs>
    <filter id="catGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#5F4CB4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Cabeza y Orejas del Gato -->
  <path d="M 68 65 Q 100 55 132 65 L 165 24 Q 155 64 150 84 Q 170 98 175 118 Q 165 128 178 138 Q 165 152 155 155 Q 130 182 100 182 Q 70 182 45 155 Q 35 152 22 138 Q 35 128 25 118 Q 30 98 50 84 Q 45 64 35 24 Z" 
        fill="#FFFFFF" stroke="#2D2158" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#catGlow)"/>

  <!-- Líneas internas de las orejas -->
  <path d="M 52 75 L 46 40 L 78 63" fill="#FFF0F5" stroke="#2D2158" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 148 75 L 154 40 L 122 63" fill="#FFF0F5" stroke="#2D2158" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cejas alegres -->
  <path d="M 66 84 Q 78 76 90 84" fill="none" stroke="#2D2158" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M 110 84 Q 122 76 134 84" fill="none" stroke="#2D2158" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Ojos grandes y expresivos con brillo -->
  <ellipse cx="78" cy="105" rx="13" ry="16" fill="#2D2158"/>
  <circle cx="75" cy="100" r="5" fill="#FFFFFF"/>
  <circle cx="82" cy="112" r="2.2" fill="#FFFFFF"/>

  <ellipse cx="122" cy="105" rx="13" ry="16" fill="#2D2158"/>
  <circle cx="119" cy="100" r="5" fill="#FFFFFF"/>
  <circle cx="126" cy="112" r="2.2" fill="#FFFFFF"/>

  <!-- Nariz pequeña triangular -->
  <polygon points="100,126 94,118 106,118" fill="#FF8A80" stroke="#2D2158" stroke-width="3" stroke-linejoin="round"/>

  <!-- Sonrisa abierta y alegre -->
  <path d="M 86 136 Q 100 138 114 136 Q 118 153 100 156 Q 82 153 86 136 Z" fill="#FF8A80" stroke="#2D2158" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 92 148 Q 100 142 108 148" fill="none" stroke="#D32F2F" stroke-width="2" stroke-linecap="round"/>

  <!-- Mejillas sonrosadas suaves -->
  <ellipse cx="58" cy="126" rx="8" ry="5" fill="#FF8A80" opacity="0.45"/>
  <ellipse cx="142" cy="126" rx="8" ry="5" fill="#FF8A80" opacity="0.45"/>
</svg>