<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="100%" height="100%">
  <defs>
    <radialGradient id="magicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E1BEE7"/>
      <stop offset="100%" stop-color="#7B1FA2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Magic Sparkles -->
  <circle cx="195" cy="55" r="25" fill="url(#magicGlow)"/>
  <polygon points="195,40 199,50 210,55 199,60 195,70 191,60 180,55 191,50" fill="#FFD54F"/>
  <circle cx="165" cy="40" r="3" fill="#FFF59D"/>
  <circle cx="215" cy="85" r="3.5" fill="#FFF59D"/>

  <!-- Magician Cape -->
  <path d="M 85 125 C 60 180 50 230 70 240 C 90 245 150 245 170 240 C 190 230 180 180 155 125 Z" fill="#4A148C"/>
  <path d="M 95 130 L 75 235 L 165 235 L 145 130 Z" fill="#7B1FA2"/>

  <!-- Body & Suit -->
  <rect x="95" y="125" width="50" height="75" rx="10" fill="#212121"/>
  <polygon points="110,125 120,150 130,125" fill="#FFFFFF"/>
  <!-- Red Bowtie -->
  <polygon points="112,130 128,130 120,136" fill="#D32F2F"/>
  <polygon points="112,142 128,142 120,136" fill="#D32F2F"/>
  <circle cx="120" cy="136" r="3" fill="#B71C1C"/>

  <!-- Legs & Shoes -->
  <line x1="108" y1="200" x2="108" y2="238" stroke="#212121" stroke-width="10" stroke-linecap="round"/>
  <line x1="132" y1="200" x2="132" y2="238" stroke="#212121" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="104" cy="242" rx="9" ry="5" fill="#37474F"/>
  <ellipse cx="136" cy="242" rx="9" ry="5" fill="#37474F"/>

  <!-- Head -->
  <ellipse cx="120" cy="95" rx="27" ry="25" fill="#FFCCBC"/>
  <!-- Hair -->
  <path d="M 93 90 C 90 65 150 65 147 90 C 138 80 102 80 93 90 Z" fill="#3E2723"/>

  <!-- Eyes (Expressive, observative) -->
  <ellipse cx="110" cy="95" rx="6" ry="7.5" fill="#263238"/>
  <ellipse cx="130" cy="95" rx="6" ry="7.5" fill="#263238"/>
  <circle cx="108" cy="92" r="2.5" fill="#FFFFFF"/>
  <circle cx="128" cy="92" r="2.5" fill="#FFFFFF"/>

  <!-- Cheeks & Gentle Smile -->
  <circle cx="103" cy="104" r="4.5" fill="#FF8A80" opacity="0.6"/>
  <circle cx="137" cy="104" r="4.5" fill="#FF8A80" opacity="0.6"/>
  <path d="M 114 105 Q 120 113 126 105" stroke="#BF360C" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Magician Hat (with yellow band) -->
  <ellipse cx="120" cy="72" rx="42" ry="12" fill="#212121"/>
  <rect x="96" y="25" width="48" height="48" rx="4" fill="#212121"/>
  <rect x="96" y="60" width="48" height="10" fill="#FFB300"/>
  <!-- Little bird peek from hat (the surprise) -->
  <circle cx="138" cy="35" r="8" fill="#4FC3F7"/>
  <polygon points="144,35 150,37 144,39" fill="#FF9800"/>
  <circle cx="140" cy="33" r="1.5" fill="#000000"/>

  <!-- Right Arm waving Magic Wand -->
  <path d="M 145 135 L 180 85" stroke="#FFCCBC" stroke-width="8" stroke-linecap="round"/>
  <!-- Wand -->
  <line x1="172" y1="95" x2="195" y2="55" stroke="#212121" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="192" y1="60" x2="195" y2="55" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Left Hand holding coin -->
  <circle cx="90" cy="145" r="7" fill="#FFCCBC"/>
  <circle cx="86" cy="148" r="6" fill="#FFD54F" stroke="#FFA000" stroke-width="1.5"/>
</svg>
