<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="dinoSkin" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="40%" stop-color="#AED581"/>
      <stop offset="100%" stop-color="#7CB342"/>
    </radialGradient>
    <radialGradient id="bellyDino" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="100%" stop-color="#DCEDC8"/>
    </radialGradient>
  </defs>

  <!-- Dino Tail -->
  <path d="M 60 170 Q 20 180 10 145 Q 35 155 70 155 Z" fill="#7CB342"/>

  <!-- Back Foot -->
  <ellipse cx="65" cy="205" rx="16" ry="12" fill="#689F38"/>
  <circle cx="56" cy="210" r="3" fill="#FFFFFF"/>
  <circle cx="64" cy="212" r="3" fill="#FFFFFF"/>
  <circle cx="72" cy="210" r="3" fill="#FFFFFF"/>

  <!-- Front Leg Right (Back layer) -->
  <rect x="135" y="175" width="18" height="35" rx="8" fill="#689F38"/>
  <ellipse cx="144" cy="208" rx="12" ry="7" fill="#689F38"/>

  <!-- Round Plump Dino Body -->
  <ellipse cx="105" cy="165" rx="52" ry="42" fill="url(#dinoSkin)"/>
  <!-- Belly -->
  <ellipse cx="118" cy="170" rx="32" ry="28" fill="url(#bellyDino)"/>

  <!-- Soft Spots -->
  <circle cx="85" cy="145" r="5" fill="#558B2F" opacity="0.4"/>
  <circle cx="75" cy="165" r="7" fill="#558B2F" opacity="0.4"/>
  <circle cx="95" cy="185" r="4" fill="#558B2F" opacity="0.4"/>

  <!-- Front Foot -->
  <ellipse cx="108" cy="208" rx="15" ry="11" fill="#7CB342"/>
  <circle cx="98" cy="212" r="3" fill="#FFFFFF"/>
  <circle cx="106" cy="214" r="3" fill="#FFFFFF"/>
  <circle cx="114" cy="212" r="3" fill="#FFFFFF"/>

  <!-- Long graceful neck -->
  <path d="M 125 150 Q 155 120 150 75 Q 165 78 145 150 Z" fill="#8BC34A"/>

  <!-- Dino Head -->
  <ellipse cx="160" cy="72" rx="26" ry="20" fill="#9CCC65"/>

  <!-- Little smiling snout -->
  <ellipse cx="178" cy="76" rx="12" ry="10" fill="#AED581"/>
  <circle cx="184" cy="73" r="1.5" fill="#558B2F"/>

  <!-- Friendly Big Eye -->
  <ellipse cx="160" cy="65" rx="8" ry="10" fill="#FFFFFF" stroke="#558B2F" stroke-width="1.5"/>
  <circle cx="162" cy="66" r="5" fill="#33691E"/>
  <circle cx="159" cy="63" r="2" fill="#FFFFFF"/>

  <!-- Sweet Cheerful Smile (Saying NO firmly and kindly) -->
  <path d="M 166 82 Q 175 88 184 80" stroke="#33691E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <ellipse cx="158" cy="78" rx="4" ry="2.5" fill="#FF8A80" opacity="0.6"/>

  <!-- Dino Arm / Hand making a respectful "Stop / No" gentle gesture -->
  <path d="M 135 155 Q 160 145 168 135" stroke="#7CB342" stroke-width="12" stroke-linecap="round" fill="none"/>
  <ellipse cx="170" cy="132" rx="9" ry="8" fill="#8BC34A"/>
  <!-- Speech / Idea badge "DI NO CON RESPETO" -->
  <g transform="translate(145, 15)">
    <rect x="0" y="0" width="85" height="28" rx="8" fill="#FF7043"/>
    <polygon points="15,28 15,36 25,28" fill="#FF7043"/>
    <text x="42" y="18" font-family="'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle">¡DI NO!</text>
  </g>
</svg>
