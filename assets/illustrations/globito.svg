<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="100%" height="100%">
  <defs>
    <radialGradient id="fishGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#4DD0E1"/>
      <stop offset="100%" stop-color="#00ACC1"/>
    </radialGradient>
    <radialGradient id="bellyGrad" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F7FA"/>
    </radialGradient>
  </defs>

  <!-- Bubbles -->
  <circle cx="22" cy="70" r="7" fill="#E0F7FA" opacity="0.6"/>
  <circle cx="36" cy="45" r="5" fill="#E0F7FA" opacity="0.6"/>
  <circle cx="30" cy="100" r="4" fill="#E0F7FA" opacity="0.5"/>
  <circle cx="215" cy="60" r="8" fill="#E0F7FA" opacity="0.6"/>

  <!-- Back Fin / Tail -->
  <path d="M 40 110 C 15 80 10 140 40 120 Z" fill="#26C6DA" stroke="#0097A7" stroke-width="3"/>
  <path d="M 32 98 L 22 105" stroke="#00838F" stroke-width="2"/>
  <path d="M 32 122 L 20 125" stroke="#00838F" stroke-width="2"/>

  <!-- Dorsal & Ventral Fins -->
  <path d="M 120 40 C 135 15 155 35 145 46 Z" fill="#26C6DA" stroke="#0097A7" stroke-width="2.5"/>
  <path d="M 115 178 C 130 198 150 185 140 174 Z" fill="#26C6DA" stroke="#0097A7" stroke-width="2.5"/>

  <!-- Round Body (Inflating for Calm) -->
  <ellipse cx="125" cy="110" rx="72" ry="68" fill="url(#fishGrad)" stroke="#00838F" stroke-width="4"/>

  <!-- Belly highlight -->
  <ellipse cx="132" cy="130" rx="46" ry="38" fill="url(#bellyGrad)" opacity="0.85"/>

  <!-- Friendly Spines (soft, rounded) -->
  <path d="M 68 78 L 60 70 M 78 58 L 72 48 M 165 55 L 175 46 M 188 78 L 200 72 M 190 142 L 202 148 M 168 165 L 176 176 M 75 155 L 66 164 M 60 115 L 50 115" stroke="#00838F" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Cute Big Eyes (Peaceful and Calm) -->
  <ellipse cx="145" cy="92" rx="13" ry="15" fill="#FFFFFF" stroke="#00838F" stroke-width="2.5"/>
  <circle cx="147" cy="93" r="8" fill="#00695C"/>
  <circle cx="144" cy="89" r="3.5" fill="#FFFFFF"/>
  <circle cx="151" cy="97" r="1.5" fill="#FFFFFF"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="160" cy="115" rx="9" ry="6" fill="#FF8A80" opacity="0.6"/>

  <!-- Side Pectoral Fin (Waving gently) -->
  <path d="M 105 115 C 80 100 85 130 105 130 Z" fill="#80DEEA" stroke="#00838F" stroke-width="2.5"/>

  <!-- Calm smiling mouth breathing gently -->
  <path d="M 178 114 Q 186 118 184 125 Q 174 128 170 120" fill="#FF8A80" stroke="#00838F" stroke-width="2.5" stroke-linecap="round"/>
</svg>
